name: Force Build Android APK Run

on:
  workflow_dispatch: # Allows you to manually trigger the build with a button

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Stax is a modern Kotlin app; Java 17 is recommended
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleProductionDebug -Dorg.gradle.internal.http.connectionTimeout=120000 -Dcom.sun.net.ssl.checkRevocation=false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stax-Debug-APK
          path: app/build/outputs/apk/production/debug/*.apk
